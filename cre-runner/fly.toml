# fly.toml app configuration file generated for cre-runner on 2026-10-06T14:47:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cre-runner'
primary_region = 'sin'
# Executions run after the webhook is acknowledged; on stop the runner waits for them
# (SHUTDOWN_GRACE_SECONDS) before exiting, so give it time. Fly allows at most 5m.
kill_signal = 'SIGTERM'
kill_timeout = '5m'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  # The cre simulator and the in-process LLM reviewer need more than 256mb.
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
