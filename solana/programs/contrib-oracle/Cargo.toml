[package]
name = "contrib-oracle"
version = "0.1.0"
description = "ContribOracle campaign treasury: pays contributors from CRE reward reports"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "contrib_oracle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", default-features = false, features = ["token", "token_2022"] }
