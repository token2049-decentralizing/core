[package]
name = "contrib-oracle-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
contrib-oracle = { path = "../programs/contrib-oracle", features = ["no-entrypoint"] }
anchor-lang = "0.31.1"
litesvm = "=0.7.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
